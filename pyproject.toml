[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "everycli"
version = "0.1.0"
description = "Find the exact CLI command you need, in natural language."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "torch",
    "sentence-transformers",
    "rank_bm25",
    "pick",
]

[project.scripts]
everycli = "everycli.everycli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["everycli*"]

[tool.setuptools.package-data]
"everycli" = ["data/commands/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]