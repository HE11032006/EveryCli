name: Build and Release

on:
  push:
    branches: [ "main", "reverie-hacks-2026" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "reverie-hacks-2026" ]
  workflow_dispatch:

jobs:
  build-rust:
    name: Build Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run Tests
      run: cargo test --manifest-path rust/Cargo.toml -p everycli-rs -p everycli-core -p everycli-daemon

    - name: Install cargo-audit
      if: matrix.os == 'ubuntu-latest'
      run: cargo install cargo-audit --locked

    - name: Audit Rust dependencies
      if: matrix.os == 'ubuntu-latest'
      run: cargo audit --manifest-path rust/Cargo.toml

    - name: Build Release Binaries
      run: cargo build --release --manifest-path rust/Cargo.toml -p everycli-rs -p everycli-daemon

    - name: Prepare Release Bundle
      shell: bash
      run: |
        mkdir -p dist_bundle/bin
        mkdir -p dist_bundle/data/commands
        mkdir -p dist_bundle/model
        mkdir -p dist_bundle/runtime

        cp -r everycli/data/commands/* dist_bundle/data/commands/

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp rust/target/release/everycli-rs.exe dist_bundle/bin/everycli.exe
          cp rust/target/release/everycli-daemon.exe dist_bundle/bin/everycli-daemon.exe
          cp install.ps1 dist_bundle/
          cp uninstall.ps1 dist_bundle/
          # Pack windows zip
          cd dist_bundle && zip -r ../everycli-windows.zip . && cd ..
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          cp rust/target/release/everycli-rs dist_bundle/bin/everycli
          cp rust/target/release/everycli-daemon dist_bundle/bin/everycli-daemon
          cp install.sh dist_bundle/
          chmod +x dist_bundle/bin/* dist_bundle/install.sh
          cd dist_bundle && zip -r ../everycli-macos.zip . && cd ..
        else
          cp rust/target/release/everycli-rs dist_bundle/bin/everycli
          cp rust/target/release/everycli-daemon dist_bundle/bin/everycli-daemon
          cp install.sh dist_bundle/
          chmod +x dist_bundle/bin/* dist_bundle/install.sh
          cd dist_bundle && zip -r ../everycli-linux.zip . && cd ..
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: everycli-${{ matrix.os }}
        path: everycli-*.zip

  release:
    name: Create GitHub Release
    needs: [build-rust]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -name "everycli-*.zip" -exec cp {} release_assets/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body: |
            🚀 **EveryCli ${{ github.ref_name }}**

            - Native Rust high-performance binary with sub-50ms hybrid lexical & semantic retrieval.
            - Background daemon (`everycli-daemon`) with automatic service setup.
            - Universal LLM assist (`everycli ask`) with auto-provider detection (Gemini, Groq, Mistral, OpenAI, etc.).
            - 100% offline-first command search and personal corpus manager (`add`, `list`, `remove`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
