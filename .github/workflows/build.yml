name: Build and Release

on:
  push:
    branches: [ "main", "improve_daemon" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download Model
      run: |
        python -c "from sentence_transformers import SentenceTransformer; model = SentenceTransformer('paraphrase-multilingual-MiniLM-L12-v2'); model.save('paraphrase-multilingual-MiniLM-L12-v2')"

    - name: Build with PyInstaller (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller everycli-daemon.spec --clean
        # On prépare le pack de distribution
        cp dist/everycli dist/everycli-wrapper 2>/dev/null || true
        # On renomme pour la clarté dans l'artéfact
        mv dist/everycli-daemon dist/everycli-daemon-bin 2>/dev/null || true
        mv dist/everycli-wrapper dist/everycli 2>/dev/null || true

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller everycli-daemon.spec --clean
        # On s'assure que le wrapper PowerShell est inclus
        cp everycli.ps1 dist/everycli.ps1

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: everycli-${{ matrix.os }}
        path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p release_assets
          # On renomme et on regroupe les binaires de façon propre
          cp artifacts/everycli-ubuntu-latest/everycli-daemon-bin release_assets/everycli-linux
          cp artifacts/everycli-macos-latest/everycli-daemon-bin release_assets/everycli-macos
          cp artifacts/everycli-windows-latest/everycli-daemon.exe release_assets/everycli-windows.exe
          cp artifacts/everycli-windows-latest/everycli.ps1 release_assets/everycli.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/everycli-linux
            release_assets/everycli-macos
            release_assets/everycli-windows.exe
            release_assets/everycli.ps1
          body: "🚀 Nouvelle release de EveryCli. Téléchargez le binaire correspondant à votre système."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
