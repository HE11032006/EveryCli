name: Build and Release

on:
  push:
    branches: [ "main", "improve_daemon" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller everycli-daemon.spec --clean
        # On prépare le pack de distribution
        cp dist/everycli dist/everycli-wrapper 2>/dev/null || true
        # On renomme pour la clarté dans l'artéfact
        mv dist/everycli-daemon dist/everycli-daemon-bin 2>/dev/null || true
        mv dist/everycli-wrapper dist/everycli 2>/dev/null || true

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller everycli-daemon.spec --clean
        # On s'assure que le wrapper PowerShell est inclus
        cp everycli.ps1 dist/everycli.ps1

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: everycli-${{ matrix.os }}
        path: dist/
