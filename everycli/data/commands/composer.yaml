# Commandes Composer (YAML)

- id: composer_install
  description: Installer les dépendances du projet
  description_en: "Install project dependencies"
  tags: [composer, install, dépendances, vendor, php, bibliothèque, installer, projet, récupération]
  command: "composer install"
  explanation: Installe toutes les dépendances listées dans le fichier `composer.json` et génère le dossier `vendor/`.
  explanation_en: "Installs all dependencies listed in the `composer.json` file and generates the `vendor/` folder."
  options:
    - "--no-dev": "Installe uniquement les dépendances de production (pas celles en `require-dev`)."
    - "--dry-run": "Simule l'installation sans modifier les fichiers."
    - "--ignore-platform-reqs": "Ignore les exigences de plateforme (ex: PHP version)."

- id: composer_update
  description: Mettre à jour les dépendances
  description_en: "Update dependencies"
  tags: [composer, update, mise à jour, dépendances, php, bibliothèque, rafraîchir, nouveau, version, lock, lockfile]
  command: "composer update"
  explanation: Met à jour toutes les dépendances vers leurs dernières versions compatibles avec `composer.json`.
  explanation_en: "Updates all dependencies to their latest versions compatible with `composer.json`."
  warning: "Peut casser votre projet si les mises à jour introduisent des changements incompatibles."
  warning_en: "May break your project if updates introduce incompatible changes."
  options:
    - "--no-dev": "Met à jour uniquement les dépendances de production."
    - "--lock": "Met à jour uniquement le fichier `composer.lock` sans installer les dépendances."
    - "nom_du_paquet": "Met à jour un paquet spécifique (ex: `composer update mon/logger`)."

- id: composer_require
  description: Ajouter une nouvelle dépendance
  description_en: "Add a new dependency"
  tags: [composer, require, ajouter, dépendance, paquet, php, bibliothèque, installation, inclure]
  command: "composer require nom_du_paquet"
  explanation: Ajoute une dépendance au projet et l'installe immédiatement. Met à jour `composer.json` et `composer.lock`.
  explanation_en: "Adds a dependency to the project and installs it immediately. Updates `composer.json` and `composer.lock`."
  example: "composer require monolog/monolog:^2.0"
  options:
    - "--dev": "Ajoute la dépendance uniquement pour le développement (section `require-dev`)."
    - "--no-update": "Ajoute la dépendance sans l'installer immédiatement."

- id: composer_remove
  description: Supprimer une dépendance
  description_en: "Remove a dependency"
  tags: [composer, remove, supprimer, dépendance, paquet, php, bibliothèque, enlever, retirer, effacer]
  command: "composer remove nom_du_paquet"
  explanation: Supprime une dépendance du projet et met à jour `composer.json` et `composer.lock`.
  explanation_en: "Remove a dependency from the project and update `composer.json` and `composer.lock`."

- id: composer_init
  description: Initialiser un nouveau projet Composer
  description_en: "Initialize a new Composer project"
  tags: [composer, init, projet, nouveau, php, création, initialisation, démarrage]
  command: "composer init"
  explanation: Crée un fichier `composer.json` interactivement pour un nouveau projet.
  explanation_en: "Creates a `composer.json` file interactively for a new project."
  options:
    - "--name": "Spécifie le nom du projet (ex: `composer init --name=mon/projet`)."
    - "--type": "Spécifie le type de projet (ex: `library`, `project`)."

- id: composer_create_project
  description: Créer un nouveau projet à partir d'un paquet existant
  description_en: "Create a new project from an existing package"
  tags: [composer, create-project, projet, paquet, php, installation, scaffold, squelette]
  command: "composer create-project nom_du_paquet nom_du_dossier"
  explanation: Télécharge un paquet et ses dépendances dans un nouveau dossier.
  explanation_en: "Download a package and its dependencies to a new folder."
  example: "composer create-project laravel/laravel mon-projet"
  options:
    - "--prefer-dist": "Préfère télécharger une archive du paquet plutôt que de cloner le dépôt Git."
    - "--remove-vcs": "Supprime le dossier `.git` du paquet téléchargé."

- id: composer_dump_autoload
  description: Régénérer l'autoload des classes
  description_en: "Regenerate class autoload"
  tags: [composer, dump-autoload, autoload, classes, php, rafraîchir, optimisation, chargement]
  command: "composer dump-autoload"
  explanation: Régénère le fichier `vendor/autoload.php` en fonction des règles d'autoload définies dans `composer.json`.
  explanation_en: "Regenerates the `vendor/autoload.php` file based on the autoload rules defined in `composer.json`."
  options:
    - "--optimize": "Optimise l'autoloader pour une meilleure performance (recommandé en production)."
    - "--classmap-authoritative": "Force Composer à utiliser uniquement le classmap pour l'autoloading."

- id: composer_config
  description: Modifier la configuration de Composer
  description_en: "Change Composer configuration"
  tags: [composer, config, configuration, paramètre, php, régler, ajuster, options]
  command: "composer config [options]"
  explanation: Permet de configurer des paramètres globaux ou spécifiques au projet.
  explanation_en: "Allows you to configure global or project-specific settings."
  options:
    - "platform.php": "Définir la version de PHP (ex: `composer config platform.php 8.1`)."
    - "github-oauth": "Configurer un token OAuth pour GitHub (ex: `composer config github-oauth.github.com TOKEN`)."
    - "process-timeout": "Définir le timeout pour les processus (en secondes)."
  example: "composer config -g process-timeout 1800"

- id: composer_config_list
  description: Lister la configuration actuelle
  description_en: "List current configuration"
  tags: [composer, config, liste, afficher, php, voir, paramètres]
  command: "composer config --list"
  explanation: Affiche tous les paramètres de configuration actuels (globaux et locaux).
  explanation_en: "Shows all current configuration settings (global and local)."

- id: composer_clear_cache
  description: Vider le cache de Composer
  description_en: "Clear Composer cache"
  tags: [composer, cache, clear, vider, php, nettoyer, espace, supprimer]
  command: "composer clear-cache"
  explanation: Supprime tous les fichiers mis en cache par Composer (paquets, métadonnées, etc.).
  explanation_en: "Removes all files cached by Composer (packages, metadata, etc.)."

- id: composer_validate
  description: Valider le fichier composer.json
  description_en: "Validate the composer.json file"
  tags: [composer, validate, valider, composer.json, php, vérifier, syntaxe, erreur]
  command: "composer validate"
  explanation: Vérifie que le fichier `composer.json` est valide et bien formaté.
  explanation_en: "Check that the `composer.json` file is valid and well formatted."

- id: composer_show
  description: Lister les dépendances installées
  description_en: "List installed dependencies"
  tags: [composer, show, dépendances, liste, paquets, php, bibliothèque, voir, inventaire]
  command: "composer show"
  explanation: Affiche la liste des paquets installés, leurs versions et leurs dépendances.
  explanation_en: "Shows the list of installed packages, their versions and their dependencies."
  options:
    - "--tree": "Affiche les dépendances sous forme d'arborescence."
    - "nom_du_paquet": "Affiche les informations pour un paquet spécifique (ex: `composer show monolog/monolog`)."

- id: composer_why
  description: Savoir pourquoi une dépendance est installée
  description_en: "Know why a dependency is installed"
  tags: [composer, why, dépendance, raison, php, origine, requis, source]
  command: "composer why nom_du_paquet"
  explanation: Explique pourquoi un paquet est installé (quelles autres dépendances l'exigent).
  explanation_en: "Explains why a package is installed (what other dependencies require it)."

- id: composer_run_script
  description: Exécuter un script défini dans composer.json
  description_en: "Run a script defined in composer.json"
  tags: [composer, run, script, exécuter, php, commande, lancer, automatique]
  command: "composer run [nom_du_script] [-- [args]]"
  explanation: Exécute un script défini dans la section `scripts` de `composer.json`.
  explanation_en: "Runs a script defined in the `scripts` section of `composer.json`."

- id: composer_self_update
  description: Mettre à jour Composer lui-même
  description_en: "Update Composer itself"
  tags: [composer, self-update, mise à jour, version, php, outil, binaire]
  command: "composer self-update"
  explanation: Met à jour Composer vers sa dernière version.
  explanation_en: "Updates Composer to its latest version."
  warning: "Nécessite des droits d'administration (`sudo`) si Composer est installé globalement."
  warning_en: "Requires administrative rights (`sudo`) if Composer is installed globally."

- id: composer_version
  description: Voir la version de Composer
  description_en: "View Composer version"
  tags: [composer, version, --version, php, info]
  command: "composer --version"
  explanation: Affiche la version actuelle de Composer.
  explanation_en: "Shows the current version of Composer."

- id: composer_search
  description: Rechercher un paquet sur Packagist
  description_en: "Search for a package on Packagist"
  tags: [composer, search, rechercher, paquet, packagist, php, trouver, bibliothèque]
  command: "composer search nom_du_paquet"
  explanation: Recherche des paquets sur [Packagist](https://packagist.org/) par nom ou mot-clé.
  explanation_en: "Search for packages on [Packagist](https://packagist.org/) by name or keyword."

- id: composer_browse
  description: Ouvrir la page Packagist d'un paquet
  description_en: "Open a package's Packagist page"
  tags: [composer, browse, packagist, paquet, php, web, navigateur, documentation]
  command: "composer browse nom_du_paquet"
  explanation: Ouvre la page du paquet sur Packagist dans le navigateur par défaut.
  explanation_en: "Opens the package page on Packagist in the default browser."
