# Commandes Linux courantes (YAML)
linux_commands:

  # ===== Système =====
  system:
    - id: system_reboot
      description: Redémarrer le système
      description_en: "Restart the system"
      tags: [système, redémarrer, reboot, relancer, machine]
      command: "sudo reboot"
      explanation: Redémarre immédiatement la machine.
      explanation_en: "Immediately restart the machine."

    - id: system_shutdown
      description: Éteindre le système
      description_en: "Shut down the system"
      tags: [système, éteindre, shutdown, halt, arrêter, couper, stop]
      command: "sudo shutdown -h now"
      explanation: Éteint la machine immédiatement.
      explanation_en: "Turn off the machine immediately."

    - id: system_update
      description: Mettre à jour les paquets (Debian/Ubuntu)
      description_en: "Update packages (Debian/Ubuntu)"
      tags: [système, mise à jour, update, apt, paquets, upgrade, logiciel, installer]
      command: "sudo apt update && sudo apt upgrade -y"
      explanation: Met à jour la liste des paquets et installe les mises à jour disponibles.
      explanation_en: "Updates the package list and installs available updates."

    - id: system_check_os
      description: Vérifier la version de l'OS
      description_en: "Check OS version"
      tags: [système, version, OS, distribution, release, linux, distro, quel]
      command: "lsb_release -a"
      explanation: Affiche des informations sur la distribution Linux utilisée.
      explanation_en: "Shows information about the Linux distribution used."

    - id: system_check_kernel
      description: Vérifier la version du noyau
      description_en: "Check kernel version"
      tags: [système, noyau, kernel, version, uname, coeur]
      command: "uname -r"
      explanation: Affiche la version du noyau Linux.
      explanation_en: "Shows the Linux kernel version."

    - id: system_check_uptime
      description: Voir depuis combien de temps le système est en marche
      description_en: "See how long the system has been running"
      tags: [système, uptime, temps, marche, allumé, durée]
      command: "uptime"
      explanation: Affiche le temps écoulé depuis le dernier démarrage.
      explanation_en: "Shows the time since the last startup."

    - id: system_check_hostname
      description: Voir le nom de la machine
      description_en: "See machine name"
      tags: [système, hostname, nom, machine, hôte, identifier]
      command: "hostname"
      explanation: Affiche le nom d'hôte de la machine.
      explanation_en: "Displays the host name of the machine."

    - id: system_check_cpu
      description: Voir les informations sur le processeur
      description_en: "View processor information"
      tags: [système, CPU, processeur, info, matériel, hardware, coeurs, architecture]
      command: "lscpu"
      explanation: Affiche des détails sur l'architecture et les cœurs du CPU.
      explanation_en: "Shows details about the CPU architecture and cores."

    - id: system_check_memory
      description: Voir l'utilisation de la mémoire
      description_en: "View memory usage"
      tags: [système, mémoire, RAM, free, swap, disponible, consommation]
      command: "free -h"
      explanation: Affiche l'utilisation de la mémoire vive (RAM) et de la swap.
      explanation_en: "Displays RAM and swap usage."

    - id: system_check_disk
      description: Voir l'espace disque disponible
      description_en: "View available disk space"
      tags: [système, disque, espace, df, partition, stockage, libre, occupation, plein]
      command: "df -h"
      explanation: Affiche l'espace disque utilisé et disponible pour chaque partition.
      explanation_en: "Shows the used and available disk space for each partition."

  # ===== Fichiers et Répertoires =====
  files:
    - id: files_list
      description: Lister les fichiers et répertoires
      description_en: "List files and directories"
      tags: [fichiers, lister, ls, répertoire, dossier, contenu, voir]
      command: "ls -l"
      explanation: Affiche la liste des fichiers et répertoires avec leurs permissions, propriétaire, taille et date de modification.
      explanation_en: "Displays the list of files and directories with their permissions, owner, size and modification date."

    - id: files_list_all
      description: Lister tous les fichiers (y compris cachés)
      description_en: "List all files (including hidden)"
      tags: [fichiers, lister, cachés, ls, all, point, secrets, tout]
      command: "ls -la"
      explanation: Affiche tous les fichiers, y compris les fichiers cachés (commencant par un point).
      explanation_en: "Shows all files, including hidden files (starting with a dot)."

    - id: files_create
      description: Créer un fichier vide
      description_en: "Create an empty file"
      tags: [fichiers, créer, touch, vide, nouveau, fichier]
      command: "touch nom_du_fichier"
      explanation: Crée un fichier vide s'il n'existe pas, ou met à jour son horodatage s'il existe déjà.
      explanation_en: "Creates an empty file if it does not exist, or updates its timestamp if it already exists."

    - id: files_create_directory
      description: Créer un répertoire
      description_en: "Create a directory"
      tags: [fichiers, répertoire, dossier, créer, mkdir, nouveau]
      command: "mkdir nom_du_repertoire"
      explanation: Crée un nouveau répertoire.
      explanation_en: "Creates a new directory."

    - id: files_create_directory_recursive
      description: Créer un répertoire et ses sous-répertoires
      description_en: "Create a directory and its subdirectories"
      tags: [fichiers, répertoire, dossier, créer, récursif, mkdir, parents, chemin]
      command: "mkdir -p chemin/vers/le/repertoire"
      explanation: Crée un répertoire et tous ses parents s'ils n'existent pas.
      explanation_en: "Creates a directory and all its parents if they do not exist."

    - id: files_copy
      description: Copier un fichier ou un répertoire
      description_en: "Copy a file or directory"
      tags: [fichiers, copier, cp, répertoire, dossier, dupliquer]
      command: "cp source destination"
      explanation: Copie un fichier ou un répertoire vers une destination. Utilisez `-r` pour copier récursivement un répertoire.
      explanation_en: "Copies a file or directory to a destination. Use `-r` to recursively copy a directory."

    - id: files_move
      description: Déplacer ou renommer un fichier ou un répertoire
      description_en: "Move or rename a file or directory"
      tags: [fichiers, déplacer, renommer, mv, changer, nom, dossier]
      command: "mv source destination"
      explanation: Déplace ou renomme un fichier ou un répertoire.
      explanation_en: "Moves or renames a file or directory."

    - id: files_remove
      description: Supprimer un fichier
      description_en: "Delete a file"
      tags: [fichiers, supprimer, rm, effacer, détruire, corbeille, enlever]
      command: "rm nom_du_fichier"
      explanation: Supprime un fichier. Utilisez `-f` pour forcer la suppression et `-r` pour supprimer récursivement un répertoire.
      explanation_en: "Deletes a file. Use `-f` to force delete and `-r` to recursively delete a directory."

    - id: files_remove_directory
      description: Supprimer un répertoire (vide)
      description_en: "Delete a directory (empty)"
      tags: [fichiers, répertoire, supprimer, rmdir, dossier, vide]
      command: "rmdir nom_du_repertoire"
      explanation: Supprime un répertoire vide.
      explanation_en: "Deletes an empty directory."

    - id: files_remove_recursive
      description: Supprimer un répertoire et son contenu
      description_en: "Delete a directory and its contents"
      tags: [fichiers, répertoire, supprimer, récursif, rm, dossier, forcer, tout]
      command: "rm -rf nom_du_repertoire"
      explanation: Supprime un répertoire et tout son contenu de manière récursive et forcée.
      explanation_en: "Deletes a directory and all its contents recursively and forcefully."

    - id: files_find
      description: Rechercher des fichiers
      description_en: "Search for files"
      tags: [fichiers, rechercher, find, nom, chercher, trouver, localiser]
      command: "find /chemin -name 'nom_du_fichier'"
      explanation: Recherche des fichiers ou répertoires par nom dans un chemin donné.
      explanation_en: "Searches for files or directories by name in a given path."

    - id: files_grep
      description: Rechercher du texte dans des fichiers
      description_en: "Find text in files"
      tags: [fichiers, rechercher, texte, grep, contenu, mot, filtrer]
      command: "grep 'texte' nom_du_fichier"
      explanation: Recherche une chaîne de caractères dans un fichier. Utilisez `-r` pour rechercher récursivement dans un répertoire.
      explanation_en: "Search for a character string in a file. Use `-r` to search recursively in a directory."

    - id: files_cat
      description: Afficher le contenu d'un fichier
      description_en: "Show the contents of a file"
      tags: [fichiers, afficher, contenu, cat, lire, voir]
      command: "cat nom_du_fichier"
      explanation: Affiche le contenu d'un fichier dans le terminal.
      explanation_en: "Displays the contents of a file in the terminal."

    - id: files_less
      description: Afficher le contenu d'un fichier page par page
      description_en: "View the contents of a file page by page"
      tags: [fichiers, afficher, page, less, lire, naviguer, grand, fichier]
      command: "less nom_du_fichier"
      explanation: Affiche le contenu d'un fichier page par page, permettant de naviguer avec les flèches.
      explanation_en: "Displays the contents of a file page by page, allowing navigation with the arrows."

    - id: files_head
      description: Afficher les premières lignes d'un fichier
      description_en: "Show the first lines of a file"
      tags: [fichiers, afficher, premières lignes, head, début, haut]
      command: "head -n 10 nom_du_fichier"
      explanation: Affiche les 10 premières lignes d'un fichier.
      explanation_en: "Shows the first 10 lines of a file."

    - id: files_tail
      description: Afficher les dernières lignes d'un fichier
      description_en: "Show the last lines of a file"
      tags: [fichiers, afficher, dernières lignes, tail, fin, bas, suivre, log]
      command: "tail -n 10 nom_du_fichier"
      explanation: Affiche les 10 dernières lignes d'un fichier. Utilisez `-f` pour suivre les mises à jour en temps réel.
      explanation_en: "Shows the last 10 lines of a file. Use `-f` to track real-time updates."

    - id: files_tar
      description: Compresser un répertoire en .tar.gz
      description_en: "Compress a directory to .tar.gz"
      tags: [fichiers, compresser, tar, archive, grouper, zipper, gz]
      command: "tar -czvf archive.tar.gz /chemin/vers/repertoire"
      explanation: Compresse un répertoire ou un fichier en une archive `.tar.gz`.
      explanation_en: "Compresses a directory or file into a `.tar.gz` archive."

    - id: files_untar
      description: Décompresser une archive .tar.gz
      description_en: "Unpack a .tar.gz archive"
      tags: [fichiers, décompresser, tar, extraire, ouvrir, archive, gz]
      command: "tar -xzvf archive.tar.gz"
      explanation: Décompresse une archive `.tar.gz` dans le répertoire courant.
      explanation_en: "Unpacks a `.tar.gz` archive into the current directory."

  # ===== Permissions =====
  permissions:
    - id: permissions_change
      description: Changer les permissions d'un fichier ou répertoire
      description_en: "Change the permissions of a file or directory"
      tags: [permissions, chmod, changer, droits, accès, rwx, mode]
      command: "chmod 755 nom_du_fichier"
      explanation: "Change les permissions d'un fichier ou répertoire. Exemple : `755` donne les droits `rwxr-xr-x`."
      explanation_en: "Changes the permissions of a file or directory. Example: `755` gives `rwxr-xr-x` rights."

    - id: permissions_change_owner
      description: Changer le propriétaire d'un fichier ou répertoire
      description_en: "Change the owner of a file or directory"
      tags: [permissions, chown, propriétaire, changer, owner, user, root]
      command: "sudo chown utilisateur:groupe nom_du_fichier"
      explanation: Change le propriétaire et le groupe d'un fichier ou répertoire.
      explanation_en: "Changes the owner and group of a file or directory."

    - id: permissions_change_group
      description: Changer le groupe d'un fichier ou répertoire
      description_en: "Change the group of a file or directory"
      tags: [permissions, chgrp, groupe, changer, group]
      command: "sudo chgrp groupe nom_du_fichier"
      explanation: Change le groupe d'un fichier ou répertoire.
      explanation_en: "Changes the group of a file or directory."

  # ===== Processus =====
  processes:
    - id: processes_list
      description: Lister les processus en cours
      description_en: "List current processes"
      tags: [processus, processes, lister, list, ps, aux, courantes, running, tâches, système]
      command: "ps aux"
      explanation: Affiche tous les processus en cours avec leur PID, utilisation CPU/mémoire, et commande.
      explanation_en: "Shows all running processes with their PID, CPU/memory usage, and command."

    - id: processes_kill
      description: Tuer un processus
      description_en: "Kill a process"
      tags: [processus, tuer, kill, PID, arrêter, forcer, stopper]
      command: "kill -9 PID"
      explanation: Termine un processus de force (SIGKILL). Remplacez `PID` par l'identifiant du processus.
      explanation_en: "Terminates a force process (SIGKILL). Replace `PID` with the process identifier."

    - id: processes_kill_by_name
      description: Tuer un processus par son nom
      description_en: "Kill a process by name"
      tags: [processus, tuer, killall, nom, pkill, stopper, arrêter]
      command: "pkill -9 nom_du_processus"
      explanation: Termine tous les processus portant un nom donné.
      explanation_en: "Terminates all processes with a given name."

    - id: processes_top
      description: Afficher les processus en temps réel
      description_en: "View processes in real time"
      tags: [processus, top, temps réel, monitoring, surveillance, ressources]
      command: "top"
      explanation: Affiche une vue interactive des processus en cours, triés par utilisation CPU.
      explanation_en: "Shows an interactive view of running processes, sorted by CPU usage."

    - id: processes_htop
      description: Afficher les processus avec htop (plus convivial)
      description_en: "Show processes with htop (more user-friendly)"
      tags: [processus, htop, monitoring, interactif, surveillance, ressources, visuel]
      command: "htop"
      explanation: Alternative à `top` avec une interface plus conviviale (nécessite l'installation de `htop`).
      explanation_en: "Alternative to `top` with a more user-friendly interface (requires `htop` to be installed)."

    - id: processes_find
      description: Trouver un processus par son nom
      description_en: "Find a process by name"
      tags: [processus, trouver, pgrep, nom, chercher, pid]
      command: "pgrep -l nom_du_processus"
      explanation: Affiche le PID et le nom des processus correspondant à un nom donné.
      explanation_en: "Shows the PID and name of processes matching a given name."

  # ===== Réseau =====
  network:
    - id: network_ifconfig
      description: Afficher les interfaces réseau
      description_en: "Show network interfaces"
      tags: [réseau, ifconfig, interfaces, IP, adresse, carte]
      command: "ifconfig"
      explanation: Affiche les interfaces réseau, leurs adresses IP, et leur statut.
      explanation_en: "Displays network interfaces, their IP addresses, and their status."

    - id: network_ip
      description: Afficher l'adresse IP
      description_en: "Show IP address"
      tags: [réseau, IP, adresse, hostname, locale, machine]
      command: "hostname -I"
      explanation: Affiche les adresses IP de la machine.
      explanation_en: "Displays the machine's IP addresses."

    - id: network_ping
      description: Tester la connectivité avec une adresse
      description_en: "Test connectivity with an address"
      tags: [réseau, ping, connectivité, test, joindre, internet, latence]
      command: "ping adresse_IP_ou_nom_de_domaine"
      explanation: Envoie des paquets ICMP pour tester la connectivité avec une adresse ou un nom de domaine.
      explanation_en: "Sends ICMP packets to test connectivity with an address or domain name."

    - id: network_ss
      description: Voir les connexions réseau et ports ouverts
      description_en: "View open network connections and ports"
      tags: [réseau, network, ss, netstat, connexions, connections, ports, écoute, listening, open, socket, tcp, udp]
      command: "ss -tuln"
      explanation: Affiche les connexions réseau actives et les ports ouverts (plus rapide que `netstat`).
      explanation_en: "Shows active network connections and open ports (faster than `netstat`)."

    - id: network_curl
      description: Effectuer une requête HTTP
      description_en: "Make an HTTP request"
      tags: [réseau, curl, requête, HTTP, API, web, url, envoyer]
      command: "curl https://exemple.com"
      explanation: Effectue une requête HTTP vers une URL et affiche la réponse.
      explanation_en: "Makes an HTTP request to a URL and displays the response."

    - id: network_wget
      description: Télécharger un fichier depuis une URL
      description_en: "Download a file from a URL"
      tags: [réseau, wget, télécharger, download, web, fichier, url]
      command: "wget https://exemple.com/fichier.zip"
      explanation: Télécharge un fichier depuis une URL.
      explanation_en: "Download a file from a URL."

    - id: network_nslookup
      description: Résoudre un nom de domaine en IP
      description_en: "Resolve a domain name to IP"
      tags: [réseau, nslookup, DNS, résolution, domaine, ip, trouver]
      command: "nslookup exemple.com"
      explanation: Résout un nom de domaine en adresse IP en utilisant les serveurs DNS.
      explanation_en: "Resolves a domain name to an IP address using DNS servers."

    - id: network_traceroute
      description: Tracer la route vers une adresse
      description_en: "Trace the route to an address"
      tags: [réseau, traceroute, route, latence, chemin, rebonds, hop]
      command: "traceroute exemple.com"
      explanation: Affiche le chemin emprunté par les paquets pour atteindre une adresse, avec les temps de réponse.
      explanation_en: "Shows the path packets take to reach an address, with response times."

  # ===== Utilisateurs et Groupes =====
  users:
    - id: users_add
      description: Ajouter un nouvel utilisateur
      description_en: "Add a new user"
      tags: [utilisateurs, ajouter, useradd, créer, nouveau, membre]
      command: "sudo useradd -m nom_utilisateur"
      explanation: Crée un nouvel utilisateur avec un répertoire personnel.
      explanation_en: "Creates a new user with a home directory."

    - id: users_delete
      description: Supprimer un utilisateur
      description_en: "Delete a user"
      tags: [utilisateurs, supprimer, userdel, effacer, enlever, retirer]
      command: "sudo userdel -r nom_utilisateur"
      explanation: Supprime un utilisateur et son répertoire personnel.
      explanation_en: "Deletes a user and their home directory."

    - id: users_modify_password
      description: Changer le mot de passe d'un utilisateur
      description_en: "Change a user's password"
      tags: [utilisateurs, mot de passe, passwd, changer, sécurité, pass]
      command: "sudo passwd nom_utilisateur"
      explanation: Change le mot de passe d'un utilisateur.
      explanation_en: "Changes a user's password."

    - id: users_add_to_group
      description: Ajouter un utilisateur à un groupe
      description_en: "Add a user to a group"
      tags: [utilisateurs, groupe, ajouter, usermod, droits, appartenance]
      command: "sudo usermod -aG nom_du_groupe nom_utilisateur"
      explanation: Ajoute un utilisateur à un groupe supplémentaire.
      explanation_en: "Adds a user to an additional group."

    - id: users_list
      description: Lister tous les utilisateurs
      description_en: "List all users"
      tags: [utilisateurs, lister, cat, etc, passwd, compte, voir]
      command: "cat /etc/passwd"
      explanation: Affiche la liste de tous les utilisateurs du système.
      explanation_en: "Displays the list of all users on the system."

    - id: users_groups
      description: Voir les groupes d'un utilisateur
      description_en: "View a user's groups"
      tags: [utilisateurs, groupes, groups, afficher, appartenance]
      command: "groups nom_utilisateur"
      explanation: Affiche les groupes auxquels appartient un utilisateur.
      explanation_en: "Shows the groups a user belongs to."

  # ===== Disques et Stockage =====
  storage:
    - id: storage_mount
      description: Monter un disque ou une partition
      description_en: "Mount a disk or partition"
      tags: [stockage, monter, mount, disque, partition, usb, clé, disque dur]
      command: "sudo mount /dev/sdXn /point/de/montage"
      explanation: "Monte un disque ou une partition sur un point de montage. Remplacez `sdXn` par le nom du périphérique (ex: `sda1`)."
      explanation_en: "Mounts a disk or partition to a mount point. Replace `sdXn` with the device name (ex: `sda1`)."

    - id: storage_umount
      description: Démonter un disque ou une partition
      description_en: "Unmount a disk or partition"
      tags: [stockage, démonter, umount, disque, éjecter, retirer]
      command: "sudo umount /point/de/montage"
      explanation: Démonte un disque ou une partition précédemment montée.
      explanation_en: "Unmounts a previously mounted disk or partition."

    - id: storage_du
      description: Voir l'espace utilisé par un répertoire
      description_en: "See how much space a directory uses"
      tags: [stockage, du, espace, répertoire, dossier, taille, poids, occupation]
      command: "du -sh /chemin/vers/repertoire"
      explanation: Affiche l'espace disque utilisé par un répertoire ou un fichier.
      explanation_en: "Shows the disk space used by a directory or file."

    - id: storage_fdisk
      description: Lister les partitions disque
      description_en: "List disk partitions"
      tags: [stockage, fdisk, partitions, disque, matériel, lister, voir]
      command: "sudo fdisk -l"
      explanation: Affiche la liste des disques et de leurs partitions.
      explanation_en: "Displays the list of disks and their partitions."

    - id: storage_mkfs
      description: Formater une partition
      description_en: "Format a partition"
      tags: [stockage, mkfs, formater, partition, disque, effacer, vider]
      command: "sudo mkfs.ext4 /dev/sdXn"
      explanation: "Formate une partition en système de fichiers `ext4`. **Attention : cela efface toutes les données !**"
      explanation_en: "Formats a partition to `ext4` file system. **Warning: this erases all data!**"

  # ===== Services =====
  services:
    - id: services_start
      description: Démarrer un service
      description_en: "Start a service"
      tags: [services, démarrer, start, systemctl, lancer]
      command: "sudo systemctl start nom_du_service"
      explanation: Démarre un service système.
      explanation_en: "Starts a system service."

    - id: services_stop
      description: Arrêter un service
      description_en: "Stop a service"
      tags: [services, arrêter, stop, systemctl, couper, éteindre]
      command: "sudo systemctl stop nom_du_service"
      explanation: Arrête un service système.
      explanation_en: "Stops a system service."

    - id: services_restart
      description: Redémarrer un service
      description_en: "Restart a service"
      tags: [services, service, redémarrer, restart, systemctl, systemd, relancer]
      command: "sudo systemctl restart nom_du_service"
      explanation: Redémarre un service système.
      explanation_en: "Restarts a system service."

    - id: services_status
      description: Vérifier le statut d'un service
      description_en: "Check the status of a service"
      tags: [services, statut, status, systemctl, état, vérifier, marche]
      command: "sudo systemctl status nom_du_service"
      explanation: Affiche le statut d'un service (actif, inactif, erreurs, etc.).
      explanation_en: "Displays the status of a service (active, inactive, errors, etc.)."

    - id: services_enable
      description: Activer un service au démarrage
      description_en: "Enable a service at startup"
      tags: [services, activer, enable, démarrage, boot, automatique]
      command: "sudo systemctl enable nom_du_service"
      explanation: Configure un service pour qu'il démarre automatiquement au boot.
      explanation_en: "Configures a service so that it starts automatically at boot."

    - id: services_disable
      description: Désactiver un service au démarrage
      description_en: "Disable a service at startup"
      tags: [services, désactiver, disable, démarrage, boot, automatique]
      command: "sudo systemctl disable nom_du_service"
      explanation: Empêche un service de démarrer automatiquement au boot.
      explanation_en: "Prevents a service from starting automatically at boot."

  # ===== Compression et Archives =====
  compression:
    - id: compression_gzip
      description: Compresser un fichier avec gzip
      description_en: "Compress a file with gzip"
      tags: [compression, gzip, compresser, fichier, archive, réduire]
      command: "gzip nom_du_fichier"
      explanation: Compresse un fichier avec `gzip`. Le fichier original est remplacé par une version `.gz`.
      explanation_en: "Compress a file with `gzip`. The original file is replaced by a `.gz` version."

    - id: compression_gunzip
      description: Décompresser un fichier .gz
      description_en: "Unzip a .gz file"
      tags: [compression, gunzip, décompresser, gz, ouvrir, extraire]
      command: "gunzip nom_du_fichier.gz"
      explanation: Décompresse un fichier `.gz`.
      explanation_en: "Uncompress a `.gz` file."

    - id: compression_zip
      description: Créer une archive ZIP
      description_en: "Create a ZIP archive"
      tags: [compression, zip, archive, créer, compresser, grouper]
      command: "zip archive.zip fichier1 fichier2"
      explanation: Crée une archive ZIP contenant les fichiers spécifiés.
      explanation_en: "Creates a ZIP archive containing the specified files."

    - id: compression_unzip
      description: Décompresser une archive ZIP
      description_en: "Unzip a ZIP archive"
      tags: [compression, unzip, décompresser, ZIP, ouvrir, extraire]
      command: "unzip archive.zip"
      explanation: Décompresse une archive ZIP dans le répertoire courant.
      explanation_en: "Unzip a ZIP archive into the current directory."

  # ===== Réseau Avancé =====
  network_advanced:
    - id: network_ssh
      description: Se connecter à un serveur distant via SSH
      description_en: "Connect to a remote server via SSH"
      tags: [réseau, SSH, connexion, distant, accès, sécurisé, shell]
      command: "ssh utilisateur@adresse_IP"
      explanation: Établit une connexion SSH sécurisée vers un serveur distant.
      explanation_en: "Establishes a secure SSH connection to a remote server."

    - id: network_scp
      description: Copier un fichier vers un serveur distant via SCP
      description_en: "Copy a file to a remote server via SCP"
      tags: [réseau, SCP, copier, distant, fichier, envoyer, ssh, transfert]
      command: "scp fichier utilisateur@adresse_IP:/chemin/de/destination"
      explanation: Copie un fichier local vers un serveur distant en utilisant SCP.
      explanation_en: "Copies a local file to a remote server using SCP."

    - id: network_rsync
      description: Synchroniser des fichiers avec un serveur distant
      description_en: "Synchronize files with a remote server"
      tags: [réseau, rsync, synchroniser, distant, copier, sauvegarde, miroir]
      command: "rsync -avz /chemin/local utilisateur@adresse_IP:/chemin/distant"
      explanation: Synchronise des fichiers ou répertoires entre une machine locale et un serveur distant.
      explanation_en: "Synchronizes files or directories between a local machine and a remote server."

    - id: network_netcat
      description: Tester une connexion TCP avec netcat
      description_en: "Test a TCP connection with netcat"
      tags: [réseau, netcat, TCP, connexion, test, port, nc, ouvert]
      command: "nc -zv adresse_IP port"
      explanation: Teste si un port TCP est ouvert sur une adresse IP donnée.
      explanation_en: "Tests if a TCP port is open on a given IP address."

    - id: network_iptables
      description: Afficher les règles du pare-feu (iptables)
      description_en: "Show firewall rules (iptables)"
      tags: [réseau, iptables, pare-feu, règles, filtrage, sécurité, firewall]
      command: "sudo iptables -L -n -v"
      explanation: Affiche les règles du pare-feu configurées avec `iptables`.
      explanation_en: "Shows firewall rules configured with `iptables`."

  # ===== Logs =====
  logs:
    - id: logs_view_system
      description: Voir les logs système
      description_en: "View system logs"
      tags: [logs, système, journalctl, syslog, journal, erreurs, événements]
      command: "sudo journalctl -xe"
      explanation: Affiche les logs système avec `journalctl` (pour les distributions utilisant `systemd`).
      explanation_en: "Show system logs with `journalctl` (for distributions using `systemd`)."

    - id: logs_view_file
      description: Voir le contenu d'un fichier de log
      description_en: "View the contents of a log file"
      tags: [logs, fichier, cat, tail, lire, suivre, journal]
      command: "tail -f /var/log/nom_du_fichier.log"
      explanation: Affiche les dernières lignes d'un fichier de log et suit les mises à jour en temps réel.
      explanation_en: "Displays the last lines of a log file and tracks updates in real time."

    - id: logs_filter
      description: Filtrer les logs par service ou mot-clé
      description_en: "Filter logs by service or keyword"
      tags: [logs, filtrer, grep, journalctl, chercher, trouver, cibler]
      command: "journalctl -u nom_du_service | grep 'mot-clé'"
      explanation: Filtre les logs d'un service spécifique pour trouver des entrées contenant un mot-clé.
      explanation_en: "Filters logs for a specific service to find entries containing a keyword."

  # ===== Divers =====
  misc:
    - id: misc_date
      description: Afficher la date et l'heure actuelles
      description_en: "Show current date and time"
      tags: [divers, date, heure, time, aujourd'hui, calendrier]
      command: "date"
      explanation: Affiche la date et l'heure actuelles du système.
      explanation_en: "Displays the current system date and time."

    - id: misc_calendar
      description: Afficher un calendrier
      description_en: "View a calendar"
      tags: [divers, calendrier, cal, date, mois]
      command: "cal"
      explanation: Affiche un calendrier du mois en cours.
      explanation_en: "Displays a calendar for the current month."

    - id: misc_echo
      description: Afficher du texte dans le terminal
      description_en: "Show text in terminal"
      tags: [divers, echo, texte, afficher, imprimer, console]
      command: "echo 'Bonjour, monde !'"
      explanation: Affiche le texte passé en argument dans le terminal.
      explanation_en: "Displays the text passed as an argument in the terminal."

    - id: misc_clear
      description: Effacer le terminal
      description_en: "Clear Terminal"
      tags: [divers, clear, effacer, terminal, nettoyer, console, vide]
      command: "clear"
      explanation: Efface le contenu du terminal.
      explanation_en: "Clears the contents of the terminal."

    - id: misc_history
      description: Voir l'historique des commandes
      description_en: "View order history"
      tags: [divers, historique, history, commandes, passé, commandes, utilisé]
      command: "history"
      explanation: Affiche l'historique des commandes exécutées dans le terminal.
      explanation_en: "Shows the history of commands executed in the terminal."

    - id: misc_alias
      description: Créer un alias pour une commande
      description_en: "Create an alias for an order"
      tags: [divers, alias, raccourci, commande, personnaliser, nom]
      command: "alias ll='ls -la'"
      explanation: Crée un alias `ll` pour la commande `ls -la`. Les alias sont temporaires (pour la session en cours).
      explanation_en: "Creates an alias `ll` for the `ls -la` command. Aliases are temporary (for the current session)."

    - id: misc_whoami
      description: Voir l'utilisateur actuel
      description_en: "View current user"
      tags: [divers, whoami, utilisateur, actuel, qui, identité]
      command: "whoami"
      explanation: Affiche le nom de l'utilisateur actuel.
      explanation_en: "Displays the current user name."

    - id: misc_uname
      description: Voir des informations sur le système
      description_en: "View system information"
      tags: [divers, uname, système, info, kernel, matériel]
      command: "uname -a"
      explanation: Affiche des informations détaillées sur le système (noyau, architecture, etc.).
