[package]
name = "everycli-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
everycli-core = { path = "../everycli-core" }
owo-colors = { version = "4", features = ["supports-colors"] }
inquire = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
